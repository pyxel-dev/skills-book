<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:">
  <title>Skills Book</title>
  <link rel="stylesheet" href="../../node_modules/easymde/dist/easymde.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-top drag">
        <div class="tabs no-drag" id="tabs" role="tablist">
          <button class="tab" role="tab" data-kind="skill"><span data-i18n="tab.skill"></span><span class="tab-n" id="n-skill"></span></button>
          <button class="tab" role="tab" data-kind="agent"><span data-i18n="tab.agent"></span><span class="tab-n" id="n-agent"></span></button>
        </div>
        <label class="search no-drag">
          <span class="search-icon" data-icon="search"></span>
          <input id="filter" type="search" data-i18n-placeholder="filter.placeholder" spellcheck="false" autocomplete="off">
        </label>
        <div class="scopes no-drag" id="scopes">
          <button class="chip" data-scope="all" data-i18n="scope.all"></button>
          <button class="chip" data-scope="global" data-i18n="scope.global"></button>
          <button class="chip" data-scope="local" data-i18n="scope.local"></button>
          <button class="chip" data-scope="other" data-i18n="scope.other" hidden></button>
        </div>
      </div>

      <nav class="list" id="list" aria-label="Skills"></nav>

      <section class="roots" id="roots" hidden>
        <header class="roots-head">
          <strong data-i18n="roots.title"></strong>
          <button class="icon-btn" id="btn-roots-close" data-i18n-title="action.close" data-icon="x"></button>
        </header>
        <ul class="roots-list" id="roots-list"></ul>
        <div class="roots-actions">
          <button class="btn" id="btn-add-root"><span data-icon="plus"></span><span data-i18n="roots.add"></span></button>
          <button class="btn ghost" id="btn-reset-roots" data-i18n="roots.reset"></button>
        </div>
      </section>

      <footer class="sidebar-foot">
        <span class="count" id="count"></span>
        <button class="icon-btn" id="btn-settings" data-i18n-title="settings.title" data-icon="settings"></button>
        <button class="icon-btn" id="btn-roots" data-i18n-title="roots.title" data-icon="folders"></button>
        <button class="icon-btn" id="btn-rescan" data-i18n-title="action.rescan" data-icon="refresh"></button>
      </footer>
    </aside>

    <div class="resizer" id="resizer" role="separator" aria-orientation="vertical"></div>

    <main class="main">
      <header class="doc-head drag" id="doc-head" hidden>
        <div class="doc-meta">
          <div class="doc-title">
            <h1 id="doc-name"></h1>
            <span class="dirty-dot" id="dirty-dot" data-i18n-title="doc.unsaved" hidden></span>
          </div>
          <p class="doc-desc" id="doc-desc"></p>
          <div class="doc-origin" id="doc-origin"></div>
          <code class="doc-path" id="doc-path"></code>
        </div>
        <div class="doc-actions no-drag">
          <button class="icon-btn" id="btn-reveal" data-icon="folder"></button>
          <button class="icon-btn" id="btn-open" data-i18n-title="action.openExternal" data-icon="external"></button>
          <button class="icon-btn" id="btn-ai" data-i18n-title="ai.toggle" data-icon="sparkles"></button>
          <button class="btn primary" id="btn-save" data-i18n="action.save" disabled></button>
        </div>
      </header>

      <div class="empty drag" id="empty">
        <div class="empty-inner">
          <span class="empty-icon" data-icon="file"></span>
          <p data-i18n="doc.empty"></p>
        </div>
      </div>

      <div class="editor-wrap" id="editor-wrap" hidden>
        <textarea id="editor"></textarea>
      </div>
    </main>

    <aside class="ai-panel" id="ai-panel" hidden>
      <header class="ai-head drag">
        <select class="no-drag" id="ai-provider"></select>
        <input id="ai-model" list="ai-models" data-i18n-placeholder="ai.model" spellcheck="false" autocomplete="off">
        <datalist id="ai-models"></datalist>
        <button class="icon-btn" id="ai-clear" data-i18n-title="ai.clear" data-icon="plus"></button>
        <button class="icon-btn" id="ai-close" data-i18n-title="action.close" data-icon="x"></button>
      </header>
      <div class="ai-log" id="ai-log"></div>
      <form class="ai-form" id="ai-form">
        <textarea id="ai-text" rows="3" data-i18n-placeholder="ai.placeholder" spellcheck="false"></textarea>
        <button class="btn primary" id="ai-send" type="submit"></button>
      </form>
    </aside>

    <section class="settings" id="settings" hidden>
      <header class="settings-head drag">
        <h1 data-i18n="settings.title"></h1>
        <button class="icon-btn" id="settings-close" data-i18n-title="action.close" data-icon="x"></button>
      </header>
      <div class="settings-body">
        <label class="settings-row">
          <span data-i18n="lang.label"></span>
          <select id="lang"></select>
        </label>

        <h2 data-i18n="settings.ai"></h2>
        <p class="settings-note" data-i18n="settings.privacy"></p>

        <form class="settings-row" data-key="anthropic">
          <span data-i18n="ai.provider.anthropic"></span>
          <input type="password" spellcheck="false" autocomplete="off">
          <button class="btn" type="submit" data-i18n="action.save"></button>
          <button class="btn ghost" type="button" data-i18n="settings.key.delete"></button>
        </form>

        <form class="settings-row" data-key="openai">
          <span data-i18n="ai.provider.openai"></span>
          <input type="password" spellcheck="false" autocomplete="off">
          <button class="btn" type="submit" data-i18n="action.save"></button>
          <button class="btn ghost" type="button" data-i18n="settings.key.delete"></button>
        </form>

        <form class="settings-row" id="settings-url-form">
          <span data-i18n="settings.local.url"></span>
          <input id="settings-url" type="text" spellcheck="false" autocomplete="off">
          <button class="btn" type="submit" data-i18n="action.save"></button>
        </form>

        <form class="settings-row" data-key="local">
          <span data-i18n="ai.provider.local"></span>
          <input type="password" spellcheck="false" autocomplete="off">
          <button class="btn" type="submit" data-i18n="action.save"></button>
          <button class="btn ghost" type="button" data-i18n="settings.key.delete"></button>
        </form>
        <p class="settings-note" data-i18n="settings.local.hint"></p>
      </div>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="update-status" id="update-status" role="status" aria-live="polite" hidden>
    <span class="update-icon" data-icon="download" data-size="14"></span>
    <div class="update-body">
      <span class="update-text" id="update-text"></span>
      <div class="update-track"><div class="update-fill" id="update-fill"></div></div>
    </div>
  </div>

  <script src="../../node_modules/easymde/dist/easymde.min.js"></script>
  <script src="../shared/frontmatter.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/proposal.js"></script>
  <script src="icons.js"></script>
  <script src="settings-view.js"></script>
  <script src="ai-panel.js"></script>
  <script src="app.js"></script>
</body>
</html>
